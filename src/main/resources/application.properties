spring.application.name=Thesis

spring.jpa.hibernate.ddl-auto=validate

#TODO this should always be UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Hibernate prefers the Jackson 2 mapper when it is on the classpath (jjwt-jackson brings it in),
# which would serialize the Jackson 3 JsonNode payload as a bean instead of as JSON.
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper

#TODO for custom 404 error, this disables searching for static resources
spring.web.resources.add-mappings=false

logging.level.com.mateirobescu.thesis=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO

auth.jwt.access-token-validity-minutes=15
auth.refresh-token.validity-days=30
auth.email-verification-token.validity-hours=24
#TODO should probably be less, but will be like this for testing
auth.extension-auth-code.validity-seconds=300

app.frontend.verify-email-path=/auth/verify-email

# default profile if none specified
spring.profiles.active=dev